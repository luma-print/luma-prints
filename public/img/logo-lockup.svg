<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-label="Luma Prints — Primary Spectrum Frame">
  <g transform="translate(14,16)">
    <!-- Charcoal rounded frame -->
    <rect x="2" y="2" width="112" height="112" rx="26" fill="#161514"/>
    <!-- Inner soft edge -->
    <rect x="12" y="12" width="92" height="92" rx="18" fill="none" stroke="#FAF8F5" stroke-width="1.25" opacity="0.18"/>
    <!-- White geometric L -->
    <path d="M36 32 V92 H88 V78 H52 V32 Z" fill="#FAF8F5"/>
    <!-- Primary color calibration bars (Polaroid-inspired) -->
    <rect x="18" y="98" width="26" height="8" rx="2" fill="#E03131"/>
    <rect x="48" y="98" width="26" height="8" rx="2" fill="#F59F00"/>
    <rect x="78" y="98" width="26" height="8" rx="2" fill="#1971C2"/>
    <!-- Tiny corner registration marks -->
    <rect x="18" y="18" width="8" height="8" rx="1.5" fill="#E03131"/>
    <rect x="90" y="18" width="8" height="8" rx="1.5" fill="#1971C2"/>
  </g>
  <g transform="translate(150,42)">
    <text x="0" y="32" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="800" font-size="52" letter-spacing="3" fill="#161514">LUMA PRINTS</text>
    <text x="0" y="58" font-family="'Manrope', system-ui, sans-serif" font-weight="600" font-size="13" letter-spacing="3.5" fill="#6B6560">PHOTO &amp; PRINT STUDIO</text>
    <!-- Mini primary bars under wordmark -->
    <rect x="0" y="70" width="22" height="4" rx="1" fill="#E03131"/>
    <rect x="26" y="70" width="22" height="4" rx="1" fill="#F59F00"/>
    <rect x="52" y="70" width="22" height="4" rx="1" fill="#1971C2"/>
  </g>
</svg>
