services:
  - type: web
    name: luma-prints
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: OWNER_EMAIL
        value: Luma.prints1@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: Luma.prints1@gmail.com
      - key: SMTP_FROM
        value: Luma.prints1@gmail.com
      - key: SHIPPING_FEE
        value: "5.00"
      - key: MAX_ATTACH_MB
        value: "17"
      - key: BASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
